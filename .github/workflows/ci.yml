name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build

  rust:
    # Windows, not ubuntu: this crate is Windows-only (bundled `adb`, Media
    # Foundation decode, D3D11 presentation, WASAPI audio) and links against
    # Windows import libraries, so `cargo test` cannot link on Linux. Running it
    # on ubuntu also made clippy report platform-specific results the product
    # never sees — e.g. `irrefutable-let-patterns` in `tests/h264_offline.rs`,
    # where `Frame::Texture` is `#[cfg(windows)]`, so the pattern was refutable
    # only off Windows. No Tauri system packages are needed here; WebView2 ships
    # on the runner image.
    name: Rust (fmt + clippy + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: src-tauri
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Test
        run: cargo test
        working-directory: src-tauri
